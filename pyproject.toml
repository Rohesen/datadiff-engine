[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "datadiff-engine"
version = "0.3.0"
description = "Compare datasets: schema changes, statistical drift (PSI, KS, Jensen-Shannon), key-based row diffs and subgroup-level changes."
readme = "README.md"
requires-python = ">=3.10"

authors = [
    { name = "Rohesen Rajkamal Maurya" },
]

license = "MIT"
license-files = ["LICENSE.txt"]

keywords = [
    "data-quality",
    "data-diff",
    "data-drift",
    "dataset-comparison",
    "data-engineering",
    "pandas",
    "psi",
    "data-validation",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]

dependencies = [
    "pandas>=2.0",
    "numpy>=1.23",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
# pyarrow < 14.0.1 has a remote-code-execution bug when reading untrusted
# Parquet/IPC files (CVE-2023-47248), so older versions are excluded.
parquet = ["pyarrow>=14.0.1"]
polars = ["polars>=2.0.0", "pyarrow>=14.0.1"]
duckdb = ["duckdb>=1.1"]
rich = ["rich>=13"]
all = [
    "pyarrow>=14.0.1",
    "polars>=2.0.0",
    "duckdb>=1.1",
    "rich>=13",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "scipy>=1.10",
    "ruff>=0.6",
    "mypy>=1.10",
    "bandit>=1.7.9",
    "pip-audit>=2.7",
    "build>=1.0",
    "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/Rohesen/datadiff-engine"
Repository = "https://github.com/Rohesen/datadiff-engine"
Issues = "https://github.com/Rohesen/datadiff-engine/issues"
Changelog = "https://github.com/Rohesen/datadiff-engine/blob/main/CHANGELOG.md"

[project.scripts]
datadiff = "datadiff_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
datadiff_engine = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-ra"
filterwarnings = ["error::FutureWarning"]

[tool.coverage.run]
source = ["datadiff_engine"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
    "RUF001",  # arrows and ellipses in messages are intentional
    "RUF002",
    "RUF003",
    "SIM108",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S108", "B017", "RUF012"]

[tool.mypy]
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true
files = ["src/datadiff_engine"]

[tool.bandit]
exclude_dirs = ["tests"]
