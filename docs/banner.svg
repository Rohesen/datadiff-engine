<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0c2a4a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0 L0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="18" fill="url(#glow)"/>

  <!-- two tables with a diff -->
  <g transform="translate(64 86)">
    <rect width="62" height="100" rx="8" fill="#0f2740" stroke="#38bdf8" stroke-width="2"/>
    <rect x="72" y="20" width="62" height="100" rx="8" fill="#0f2740" stroke="#38bdf8" stroke-width="2"/>
    <g stroke="#38bdf8" stroke-opacity="0.5" stroke-width="2">
      <line x1="10" y1="24" x2="52" y2="24"/><line x1="10" y1="44" x2="52" y2="44"/><line x1="10" y1="64" x2="52" y2="64"/>
      <line x1="82" y1="44" x2="124" y2="44"/><line x1="82" y1="84" x2="124" y2="84"/>
    </g>
    <line x1="82" y1="64" x2="124" y2="64" stroke="#f87171" stroke-width="4"/>
    <line x1="82" y1="104" x2="124" y2="104" stroke="#4ade80" stroke-width="4"/>
  </g>

  <text x="240" y="140" font-size="60" font-weight="700" fill="#f8fafc">datadiff-engine</text>
  <text x="242" y="184" font-size="23" fill="#bae6fd">What changed between yesterday's data and today's?</text>

  <g font-size="16" font-weight="700" font-family="JetBrains Mono, Consolas, monospace">
    <rect x="242" y="214" width="92" height="36" rx="18" fill="#0c2236" stroke="#38bdf8"/>
    <text x="288" y="238" text-anchor="middle" fill="#7dd3fc">INFO</text>
    <rect x="346" y="214" width="116" height="36" rx="18" fill="#2e2105" stroke="#f59e0b"/>
    <text x="404" y="238" text-anchor="middle" fill="#fbbf24">WARNING</text>
    <rect x="474" y="214" width="122" height="36" rx="18" fill="#2e0a0a" stroke="#ef4444"/>
    <text x="535" y="238" text-anchor="middle" fill="#f87171">CRITICAL</text>
  </g>
  <text x="616" y="238" font-size="16" fill="#94a3b8">schema · nulls · drift · new values · JSON · CI gate</text>
</svg>
