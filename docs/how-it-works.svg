<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1200" height="430" fill="#ffffff"/>

  <!-- connectors -->
  <g fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)">
    <path d="M206 165 C 236 165, 244 215, 270 215"/>
    <path d="M206 265 C 236 265, 244 215, 270 215"/>
    <path d="M398 215 C 430 215, 436 63, 462 63"/>
    <path d="M398 215 C 430 215, 436 139, 462 139"/>
    <path d="M398 215 L 462 215"/>
    <path d="M398 215 C 430 215, 436 291, 462 291"/>
    <path d="M398 215 C 430 215, 436 367, 462 367"/>
    <path d="M784 63 C 812 63, 818 215, 846 215"/>
    <path d="M784 139 C 812 139, 818 215, 846 215"/>
    <path d="M784 215 L 846 215"/>
    <path d="M784 291 C 812 291, 818 215, 846 215"/>
    <path d="M784 367 C 812 367, 818 215, 846 215"/>
  </g>

  <!-- inputs -->
  <g text-anchor="middle">
    <rect x="22" y="132" width="184" height="66" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="114" y="160" fill="#0f172a" font-size="16" font-weight="600">Old dataset</text>
    <text x="114" y="182" fill="#475569" font-size="12.5">yesterday · baseline</text>
    <rect x="22" y="232" width="184" height="66" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="114" y="260" fill="#0f172a" font-size="16" font-weight="600">New dataset</text>
    <text x="114" y="282" fill="#475569" font-size="12.5">today · candidate</text>
    <text x="114" y="336" fill="#64748b" font-size="12">pandas · Polars · DuckDB · Arrow</text>
    <text x="114" y="354" fill="#64748b" font-size="12">CSV · Parquet · JSON · Feather</text>
  </g>

  <!-- engine -->
  <rect x="274" y="180" width="124" height="70" rx="35" fill="#1e3a8a"/>
  <text x="336" y="222" fill="#ffffff" font-weight="700" font-size="18" text-anchor="middle">datadiff</text>

  <!-- checks -->
  <g font-size="14.5">
    <rect x="466" y="36" width="318" height="54" rx="9" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="484" y="59" fill="#1e3a8a" font-weight="700">Schema &amp; rows</text>
    <text x="484" y="78" fill="#334155" font-size="12.5">added/removed columns · types · row counts</text>

    <rect x="466" y="112" width="318" height="54" rx="9" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="484" y="135" fill="#1e3a8a" font-weight="700">Column quality</text>
    <text x="484" y="154" fill="#334155" font-size="12.5">nulls · uniques · new values · freshness</text>

    <rect x="466" y="188" width="318" height="54" rx="9" fill="#ecfdf5" stroke="#6ee7b7"/>
    <text x="484" y="211" fill="#065f46" font-weight="700">Statistical drift</text>
    <text x="484" y="230" fill="#334155" font-size="12.5">PSI · Kolmogorov–Smirnov · Jensen–Shannon</text>

    <rect x="466" y="264" width="318" height="54" rx="9" fill="#fff7ed" stroke="#fdba74"/>
    <text x="484" y="287" fill="#9a3412" font-weight="700">Row diff  <tspan font-weight="400" fill="#64748b">key=…</tspan></text>
    <text x="484" y="306" fill="#334155" font-size="12.5">added · removed · changed rows · bad keys</text>

    <rect x="466" y="340" width="318" height="54" rx="9" fill="#faf5ff" stroke="#d8b4fe"/>
    <text x="484" y="363" fill="#6b21a8" font-weight="700">Segments  <tspan font-weight="400" fill="#64748b">segment_by=…</tspan></text>
    <text x="484" y="382" fill="#334155" font-size="12.5">changes hidden inside one subgroup</text>
  </g>

  <!-- result -->
  <g text-anchor="middle">
    <rect x="850" y="160" width="328" height="110" rx="12" fill="#0f172a"/>
    <text x="1014" y="194" fill="#ffffff" font-size="16" font-weight="700">Issues + overall severity</text>
    <text x="1014" y="220" font-size="14" font-weight="700">
      <tspan fill="#60a5fa">INFO</tspan><tspan fill="#94a3b8"> · </tspan><tspan fill="#fbbf24">WARNING</tspan><tspan fill="#94a3b8"> · </tspan><tspan fill="#f87171">CRITICAL</tspan>
    </text>
    <text x="1014" y="248" fill="#cbd5e1" font-size="12.5">text · rich · JSON · Markdown · HTML · exit code</text>
  </g>
</svg>
